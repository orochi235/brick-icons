[project]
name = "brick-icons"
version = "0.1.0"
description = "Render LEGO parts from LDraw into bin-label bitmaps and SVGs"
requires-python = ">=3.11"
dependencies = ["pillow>=10", "numpy>=1.26", "shapely>=2.0"]

[project.scripts]
brick-icons = "brick_icons.cli:main"

[project.optional-dependencies]
occt = ["cadquery-ocp>=7.9.3"]
cadquery = ["cadquery>=2.8"]
lab = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brick_icons*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
