# Known-working versions of everything outside this repo that the render
# pipeline and its verification workflow depend on. The renders are
# CALIBRATED against these exact versions — a silent upgrade (rolling
# LDraw snapshot, brew upgrade, new resvg AA) can shift output pixels
# with no code change. Update this file deliberately, with a census
# (--list parts.txt, byte-diff + rasterize + compare) against the
# previous version.

## LDraw parts library (geometry input; vendor/ldraw, gitignored)
# complete.zip from library.ldraw.org is a ROLLING snapshot — the URL in
# setup-ldview.sh always serves the latest parts update. Verify a local
# copy:
#   cd vendor/ldraw && find p parts -name "*.dat" -type f | LC_ALL=C sort \
#     | xargs shasum -a 256 | shasum -a 256
source: https://library.ldraw.org/library/updates/complete.zip
fetched: 2026-08-30
dat-files: 36603
manifest-sha256: 5f855079307f7c1326aa6df05ce63b118e88364233d7eb3fb6ee637bc70e38fb
# Re-fetched after the local copy was lost. The previous snapshot (2026-06-27,
# 36067 files, 87641c77...) is NOT retrievable: complete.zip only ever serves
# the latest. Of 54 render cases only 50950 moved, because LDraw's Official
# Update 2026-06 landed 2026-06-28 -- one day after that fetch -- and subfiled
# the part with corrected curvature, which the engine now reads as 3 arcs
# instead of a 41-segment polyline. The other 53 are byte-identical.

## LDView (reference renderer for stock-render comparisons; vendor/LDView.app)
# setup-ldview.sh pins the 4.7 dmg by URL and verifies its sha256. Note 4.7
# is published on GitHub releases; 4.2.1 came from SourceForge.
ldview-version: 4.7 (bundle 33)
ldview-dmg: https://github.com/tcobbs/ldview/releases/download/v4.7/LDView_4.7.dmg
ldview-dmg-sha256: 100806f260cf7217f22dc6b461224d7fd2e05f6ca3cb236394a63103c6730cf7
ldview-binary-sha256: 8eb3d1ab5864525bc828fb247c3151451e5423a72da3176093b54dee0750337a
# 4.7 is a true universal binary (x86_64 + arm64, minos 11.0), so it runs
# native on Apple Silicon and ldview_launcher is now [] everywhere. 4.2.1 was
# "Universal" in the i386+x86_64 sense and needed `arch -x86_64`.
#
# Census, 4.2.1 -> 4.7, 50 parts (parts.txt + two 14769pt letter tiles),
# 1024px stock renders, same flags: 23 byte-identical, median 0.00% of pixels
# differing, mean 0.48%. Only round geometry moves, and in two distinct ways:
#   - smoother curves: 14769pt* 3.40%, 2654a 1.76%, 3673's autocrop 699->702px.
#     The 4.2.1 round tile is a visible ~14-gon; 4.7 draws a circle.
#   - a LIGHTING change: 30136 15.15% (maxdiff 44) is one side face shading
#     darker, not a geometry fix. Expect gray/mono dither to shift on parts
#     with large flat side faces.
# No frozen golden moves: every case in tests/goldens/manifest.toml is
# --shading outline, which reads .dat directly and never invokes LDView
# (asserted by tests/test_cli.py::test_outline_uses_hlr_not_ldview).

## CLI tools (Homebrew; used by verification workflow, not the library)
resvg: 0.47.0          # SVG -> PNG rasterizer; the AA reference for censuses
                       # and for tests/goldens/render/*.png. Upgrading it moves
                       # every golden raster without any engine change, so
                       # re-freeze deliberately rather than accepting the diff.
potrace: 1.16          # bitmap tracing (setup-ldview.sh path)
imagemagick: 7.1.2-24  # crops/compare in the verify workflow

## Python (runtime; pyproject.toml declares floors, these are the pins)
python: 3.14.5
numpy: 2.5.0
pillow: 12.2.0
shapely: 2.1.2
pytest: 9.1.1          # dev only
