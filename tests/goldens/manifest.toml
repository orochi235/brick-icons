# Golden conformance corpus for the engine swap.
#
# Cases are data: adding one is a row here, not a change to the harness.
# `scripts/freeze-goldens.py` writes the artifacts, `scripts/compare-goldens.py`
# diffs a fresh run against them.
#
# Part ids stay in this manifest and out of `brick_icons/` — the library holds
# no part numbers.

[parts]
# specimens.txt, which already curates studs, curves, gradients, gears and
# SNOT, plus the four printed parts the decal gates use.
#
# 4740p03 is here rather than in a recorded-failure list: the handoff's
# TopologyException does not reproduce on either seam or in the proof sheet,
# so it is an ordinary decal-heavy specimen now.
all = ["3005", "3024", "3001", "3020", "3040b", "3941", "6143", "50950",
       "4589", "3960", "4070", "87087", "99781", "4019", "3649", "6589",
       "3673", "32062", "3941p01", "3942bp01", "3068bp00", "3040bp08",
       "4740p03"]

# `all` minus every printed part, with an unprinted sibling substituted where
# that would otherwise drop a shape: 4740 for 4740p03, 3068b for 3068bp00,
# 3942c for 3942bp01. 3941 and 3040b were already present, so 3941p01 and
# 3040bp08 simply go.
#
# A print is authored as ordinary geometry, so on a strokes-only combo it is
# indistinguishable from the part: 3942bp01 carries 38 `con` primitives against
# 3942c's 2, and 4740p03 carries 3530 triangles against 4740's 0. That is
# decoration dominating a hidden-line gate. These parts belong here once decal
# extraction reaches the render path — until then they gate `outline-flat3`,
# where decoration is the point.
unprinted = ["3005", "3024", "3001", "3020", "3040b", "3941", "6143", "50950",
             "4589", "3960", "4070", "87087", "99781", "4019", "3649", "6589",
             "3673", "32062", "4740", "3068b", "3942c"]

# Enough spread to catch a combo-specific regression without paying for the
# whole list three times: flat faces, curves, a dish, SNOT, the gear stress
# case and an extruded cross-section.
spread = ["3005", "3001", "3941", "4589", "3960", "4070", "3649", "32062"]

[combo.outline-flat3]
# The primary combo, and the only one where decoration reaches SVG at all —
# plain `--shading outline` emits strokes and no fills.
parts = "all"
args = ["--format", "svg", "--shading", "outline", "--shade-style", "flat3"]

[combo.outline]
# Strokes only, occlusion ON — the isolated hidden-line-removal gate. This is
# the combo an HLR engine swap answers to: no fills, so the arc/line command
# counts move only when the kernel changes what it hides or how it curves.
# `outline-flat3` covers the same edges but mixes fill geometry into those
# counts (3001: A 58 -> 192), which is why it cannot serve.
#
# Unprinted parts only — see the `unprinted` list for why a print confounds
# this gate specifically.
parts = "unprinted"
args = ["--format", "svg", "--shading", "outline"]

[combo.wireframe]
# Occlusion culling OFF: every edge drawn, hidden or not (cli.process_one sets
# cull = opacity >= 1.0 and not wireframe). This pins the draw-everything path
# that `--opacity` also takes, and nothing else.
#
# It is NOT an HLR gate — it is the one combo that does not exercise occlusion
# at all. Difference it against `outline` to see the hidden set (3001: 46 paths
# against 26); on its own it only proves the kernel enumerates edges.
parts = "spread"
args = ["--format", "svg", "--shading", "outline", "--wireframe"]

# There is deliberately no cel combo. `--shading cel` never reaches the engine:
# cli.process_one routes it to trace.cel_svg, which posterizes the LDView raster
# and potraces the gray bands. Those cases pin LDView, potrace and PIL — swap the
# geometry kernel and they come back byte-identical, so they cannot gate it.
# Pinning that path is a separate gate with a separate rationale.

[raster]
# resvg is a dev tool, like LDView — see scripts/external-deps.lock.
width = 512
