[[defect]]
id = "3626cp7d-glasses-lose-their-color"
part = "3626cp7d"
engines = ["naive", "occt"]
status = "fixed"
title = "a minifig's dark red glasses draw as gray patches"
classes = ["decal"]
filed = "2026-09-08"
notes = "geom2d.to_geom ran set_precision BEFORE repairing validity, and set_precision empties an invalid polygon rather than fixing it -- the ordering geom2d.region's own docstring already warns about. fill_ops then dropped the whole fill at its `if g.is_empty: continue`. The glasses are the only decoration on the head that WRAPS: frame, bridge and temple arm merge to one region running from the front around to the side, whose re-projected boundary folds over itself in screen space (self-intersection at 187.5, 937.1). Every other region on the part is a valid polygon and drew correctly, which is what made it look like a color bug. Color was never lost: resolve(320) is 0x720012, the 122 triangles bind to the cylinder, merge to one region, survive absorb_wall_facets and order_faces with color 320 intact, and face_fill is simply never reached. Fixed by repairing before snapping. Blast radius, all improvements: 8 render cases move by 3 to 221 px, each a pinhole or a bitten fill edge closing where a self-intersecting fragment used to vanish (3941, 32062 inspected at 7x); 13 of 393 extraction corpus parts move, 12 recovering dropped area. The 13th, 88323c04, drops from 4 textures to 0 because a recovered group crosses the sliver bar and trips MAX_DECALS -- correctly: its five groups are faces of one orange rubber foot, a sub-part in another color, not a print."

