[[defect]]
id = "7037-gradient-banding"
part = "7037"
engines = ["naive"]
status = "open"
title = "gradients spend half their stops repeating the previous color"
filed = "2026-09-04"
notes = "Measured on the stored SVG: 102 stops across 4 gradients, 50 of them the same color as the stop before. g1 is the worst -- 59 stops for 14 distinct greys, 43 exact repeats. Consecutive equal stops are flat plateaus, so this is the banding rather than a symptom beside it. Merging equal-color runs is the obvious fix and costs no fidelity."

