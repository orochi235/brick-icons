title = "a radial gradient crescent leaks out at each knuckle joint"
seen = { angle = "iso", shading = "outline", shade_style = "flat3" }
filed = "2026-09-08"
notes = """
Two radially shaded faces show as thin crescents where the outer bars meet the
inner one's knuckles; LDView draws plain cylinder there. The gradient is fitted
to the WHOLE face, so a sliver of it shows the bullseye's centre rings, which
is what makes a few hundred pixels read as a blob.

Isolated by pulling the two paths that reference the SVG's radialGradient ids
into a document of their own -- there are exactly two in the file, and drawn
alone they are crescents at the two joints, nothing else. That is the cheap way
to ask "which face is this": the fill id names it, and the rest of the drawing
does not have to be reasoned about.

Ruled out: it is not the ring-sector fix (99a9693 changes only a 160x130 px
patch at the far left knuckle) and not _absorb_dome_walls (aaf34d8), which
changes no face at all on this part -- checked by snapshotting every face dict
across the call. So it is a coverage failure: the covering cylinder does not
quite cover the cap behind it, and the residue machinery does not absorb what
is left. Same family as the sliver/residue work, and worth reading against
order_faces' single witness.

FIXED by bbc6436 (+ the occt half swept into 2407e53). Not coverage: the
crescent is geometry LDView draws too. It is the SHADING -- each knuckle is a
4-4cylse, which no primitive substitution claims, so it sews as 16 planar
facets whose normals run right round the axis. attach_group_gradients reads
that 2-D spread as a dome. The origin separates them: a cylinder's normals lie
in the ONE plane perpendicular to its axis, so the uncentered cloud is rank 2
and a dome's is rank 3. s2/s0 measured over the specimens is 0.0000 on every
faceted cylinder (92692, 49612, 6143, 2947bc01) against 0.22 on 3960's dish
and 0.36-0.85 on the head domes; 32062's axle fillet at 0.18 is the nearest
thing under the dome band and wants the ramp too, so the cut sits at 0.05.
_relax_facet_cylinders re-fits those groups as a linear ramp across the tube,
reading the CAMERA-FACING facets only -- a plane face's view normal is flipped
toward the camera, so the far half carries its mirror's tone at the mirror's
screen position and fitting across the whole ring cancels the covariance.
Disarming the pass in process over the 22 specimens plus 7 more parts: every
specimen byte-identical, only 92692 (1486 px) and 2947bc01 (565 px) move.
Residual, not this row: a faint tone step where the r=4 knuckle meets the r=6
barrel, which is two cylinders of different radii abutting."""

