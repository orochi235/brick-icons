part = "35480"
engines = ["occt"]
status = "fixed"
title = "Stud interior gradient is wrong"
checked = { occt = "cf648025af5982760b76b0132a02816deae509419e7852a9facdb2ce852b91e9", white-occt = "36c21fa1babca9b72ac90bdd0d86f91377ea3f77fe9a0c43880f68bbf0435d36" }
filed = "2026-09-10"
notes = """
2026-09-17 review neutral: front wall is better but borehole shading is worse

2026-09-23 review better

2026-09-24: root cause found and fixed at cccfe19. The bore was never missing a gradient -- shade's max(0, n.L) pinned every normal facing away from the light to one floor tone, and looking down a bore you see exactly the half of the tube whose normals sweep 180 degrees. shade.LAMBERT_WRAP now moves the terminator to n.L = -0.3. Awaiting a redraw to judge on /review.

2026-09-24 (later): the cccfe19 diagnosis was wrong -- the bore was never on the shading floor for lack of a wrap. occt's _span_face sampled the cylinder's OUTWARD normal on every span, so a bore's far wall was lit as the outside of a tube: the middle of the visible wall, which faces the camera and the light, read as the terminator. LAMBERT_WRAP was tuned on that misreading. Fixed in the working tree, uncommitted: an away-facing span's samples are negated (occt._span_face); wall ramps are keyed by radius, so a stud's r6 wall and its r4 bore no longer share one zigzag ramp (occt._surface_key); and the refine pass can probe occt walls at last (shade._face_depth_probe read a `prim` key only naive faces carry), so a buried wall no longer paints into a hole. Awaiting a redraw to judge on /review.

2026-09-25 review fixed"""

