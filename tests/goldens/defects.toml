[[defect]]
id = "3941p01-decal-under-its-own-wall"
part = "3941p01"
engines = ["occt"]
status = "fixed"
title = "cylinder decal painted over by the wall spans it sits on"
filed = "2026-09-07"
notes = "Fixed by giving the merged region its carrier's occluder as its own depth source. The unwrap and the bind were never at fault: all 464 decoration facets bind to an analytic carrier, merge to ONE region, and reach the SVG as a single element on both engines. The region had no exact depth, so order_faces fell back to an affine plane fitted through a panel wrapped around a cylinder -- a chord plane sitting 1.4 to 4.0 LDU behind the body facets against an eps of 0.048 -- and fill_ops' boolean clip then cut the decal away against the 22 color-16 planes that came out nearer, 83% of its area. Registering carrier.occluder() alone changed nothing: unwrap.bind picks a carrier by radial distance to the SURFACE and ignores the angular sector, so the decal had bound to a 90-degree quadrant that does not contain it and every ray was clamped away as a miss, silently falling back to the same plane fit. full_occluder() opens the sector for this use. 14,651 navy px before, 72,529 after, against naive's 64,562."

