Cause (measured): the contour snaps onto a fitted limb within quadric.limb_candidate's snap tolerance, capped at 6 px. The two hemispheres share one fit, but each region makes its own candidate and occt.visible_segments keeps the first by ellipse key. The coarse hemisphere (26.6 deg facets) sags 27 canvas px inside the limb, against 3.4 px for the fine one, so its chord vertices miss the snap and stay chords.

