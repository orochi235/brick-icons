# Defects found in corpus renders, filed from the lab.
#
# Written by brick_icons.lab; hand edits are kept but reformatted on the next
# write. `mark` is in fractions of the pane box it was drawn on. `kind` and
# `points` are absent on a plain rectangle, which is every defect filed before
# 2026-09. `seen` is retained for records that carry it; the lab now asks
# labkit whether a mark is stale.


[[defect]]
id = "4524-ring-whole-circle"
part = "4524"
engines = ["naive"]
status = "open"
title = "a circle whose visible part is several arcs is drawn whole"
filed = "2026-09-04"
notes = "The neck ring keeps a complete ellipse where the near rim should cut it. In the SVG the ring comes out as 4-chunk closed arc runs (paths 11 and 13 of 21) alongside genuine 1- and 2-chunk partial arcs elsewhere in the same drawing, so partial arcs work and these specifically did not. Suspected rule: when occlusion breaks one circle into more than one visible span, the whole circle survives instead of the spans. 27448 shows the same thing."

