filed = "2026-09-03"
notes = """
2026-09-16: the occt drawing on the wall changed under this row today, and it was my refresh round that shipped it -- corpus.db's occt render for 6589 is now out/slot-occt-refresh, drawn at 161156e, replacing the 2026-09-08 store. The change is 3 components against that store, the large one 1,970 px over x34-51% y61-80%: the inner annulus lost a lighter band at its lower left.

It is not one commit's doing. Rendering 6589 at every drawing-path commit between the store's build and 65d3994 (42 of them, all at the production render_px 2048) and diffing consecutive pairs, six commits move this part:

  c95e2c9  3 comp   707 px  stop drawing a facet crease that lies on a hidden authored line
  d46962e  2 comp   241 px  mask only the loci the line mask actually holds spans for
  2407e53  2 comp   620 px  give the spans that tile one analytic wall a single ramp
  6df9e52  3 comp  1075 px  close the formed-sticker bare slope
  8d8c30f  2 comp   470 px  nudge the line mask's loose copies toward the eye
  287b1bb  1 comp    58 px  keep every arc span dedupe merges past -180 degrees polar

Only 287b1bb maps onto a component of the cumulative diff exactly (51 px at x49-51% y41-46%). The big annulus component is fed by c95e2c9, 6df9e52 and 8d8c30f, whose individual changes are adjacent and merge into one region -- and their sizes do not sum to it, so sub-threshold changes accumulate too. There is no single commit to revert.

The white-occt half of this part is a separate matter and not a regression: those dropped strokes are 490c87d's orphan cull, deliberate, and judged at the production 2048.

Still weird after c95e2c9 (138 ops to 134). No surface is dropped -- 1 con,
4 cyli, 4 ring all build. The mess is in the hub, where the ink bunches
black.

2026-09-17 review regression

2026-09-23 review regression

2026-09-25 review better

2026-11-09 review neutral"""

[[defect]]
id = "4524-ring-whole-circle"
part = "4524"
engines = ["naive"]
status = "open"
title = "a circle whose visible part is several arcs is drawn whole"
classes = ["arc-split"]
checked = { silhouette-naive = "d6e00187e4ea339406ab1f35d9b5ba2344cc16d0a20dae15507391344004a309", white-naive = "118d2e260fcff0edcd558556d02c8abab775c0f6bbec6a3b283e377a1727b9c7" }
filed = "2026-09-04"
notes = """
The neck ring keeps a complete ellipse where the near rim should cut it. In the SVG the ring comes out as 4-chunk closed arc runs (paths 11 and 13 of 21) alongside genuine 1- and 2-chunk partial arcs elsewhere in the same drawing, so partial arcs work and these specifically did not. Suspected rule: when occlusion breaks one circle into more than one visible span, the whole circle survives instead of the spans. 27448 shows the same thing.

2026-09-12: the suspected rule is WRONG, and the measurement says so. The
circles are not being broken into spans and re-closed -- they are never split
at all. Each one tests visible at EVERY sample against the full occluder set
(4524 r=100.09: 314/314; 27448 r=68.76: 216/216; 30152a r=106.89: 335/335),
and in each part it is the NEAR rim that draws whole while the far rim at the
same radius is cut correctly (4524 121/314, 27448 108/216, 30152a 204/407).
A near rim of a cylinder IS a complete ellipse, so `dedupe_segments`' circular
union and `visible_subops`' run-splitting are both behaving.

What the LDView overlay shows instead (scripts/overlay-reference.py, slot
white-naive) is that these arcs sit on FLAT SHADING, offset inward from the
shading boundary the reference draws -- clearest where 30152a's rim runs
across the stem. Over those samples the nearest occluder's depth EQUALS the
arc's own to within 0.005 (eps is 0.039): the arc is lying on its own carrier
surface and nothing is in front of it to cut it. So the question is not which
spans survive occlusion but why an edge is drawn on that carrier at all --
identify the primitive behind the arc, as 24434's entry had to.

2026-10-07, at HEAD cff1361, against LDView's edge lines (reference-lines,
drawn for this check): sheet "ring-whole-circle parts at HEAD: naive / occt /
LDView edge lines" on the wall. Measured: the circle is the neck ring's
OUTER edge at r=10.5 (4-4ring6 x1.5), not a near rim. On one half it ends at the
2-4cyli wall and is a real edge; on the other half the top plane carries on
into the square tab, which LDraw authors as a faceted 2-4ndis. smooth_rim_skips
only counted a coplanar FLAT PRIMITIVE as continuing a flat circle, so the tab
half drew as a seam line across the tab (scripts/probe-flat-rim-ops.py: the
r=10.5 op at y=0 tests visible 1.000, the one at y=2 0.388 -- the 121/314 far
rim above). occt draws the same whole ellipse, so it is wrong on both engines.

Tried on branch worktree-agent-acdf0e7ce4124624b, 3dd9753: coplanar facets on
the open side count as coverage, per angular bin
(primitives.rim_flat_facet_span_bins). Gate 1 passed: 4524 white-naive 1
region, naive 1 region, the tab half gone, matching LDView (sheet "flat edge
circles over coplanar facets"). Gate 2 FAILED on 44137: with the hole-face
circles cut, the orphan cull peels 5 window lines and an arc that LDView draws
(scripts/flat-facet-seam-affected.py --diff, with and without
--no-orphan-cull: without the cull only circle arcs move). The rule moves
65/190 sampled parts that mix ndis with rings and 21/179 others, mostly
Technic pin-hole faces. Gate 3 also reports 4589 wireframe UNEXPECTED (4
regions); 3649 moved as predicted. Not mergeable as it stands. Open question
before another try: whether the facets it counted on 44137 continue the same
face or are a back-facing surface that shares the plane.


2026-11-10: branch worktree-agent-acdf0e7ce4124624b (3dd9753 + 4748d43) deleted unmerged; the fix and its gate-2 failure are recorded above."""

