notes = "Fixed on occt by b0c5d85. The open ring was never the discriminator, and this entry named the wrong parts: 2531 (Hand Hook) and u9543 (Hand Pincer) have no rejected frames and always drew their C correctly. What failed was occt.frame() rejecting a ring, disc or edge whose matrix axis column is not square to the other two -- every vertex of those primitives sits at local y=0, so that column is not their geometry and nothing reads it. 3820 caps its grip with two 2-4ring2 whose axis column is 14 degrees off the ring's own plane, so both rims fell back to tessellation and the grip filled solid. 36 (tyre) and u151 (rubber belt) drew correctly because their transforms are axis-aligned, not because they are closed. Verify with an in-process A/B: occt.PLANAR_KINDS = () restores the old behavior, and 98642 (a torso carrying two of these hands) goes from two floating slivers to a drawn ring. Mike's 3484 entry may still name the same family from the other side."

