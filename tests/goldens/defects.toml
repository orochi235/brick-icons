Cause found, not fixed. The light strip is face fill from the plate's internal y=4 ceiling, painted over the inner-corner wall at x=-10 between screen y 60.41 and 62.45. shade.order_faces' witness depths are right pairwise (the ceiling is farther than that wall), but 11 faces -- stud walls, both inner-corner walls, the y=4 ceiling and planes at y=7.5, x=6, z=-10, z=6 -- form a constraint cycle, and _stall_release breaks it by releasing the x=6 wall and then the x=-10 wall ahead of the ceiling. Every edge in the cycle comes from a real depth (plane equations and real hits on the walls), so the cycle is genuine interpenetration, not a bad proxy. Releasing the member with the fewest unmet constraints picks the same walls (a tie broken by depth) and changes 4019, so it was reverted. Same class as 4740: a fix has to split an overlap where depth order flips, not tune the release."""

