title = "constant-width strokes drown small features"
classes = ["stroke-scale"]
checked = { silhouette-naive = "ba0d4c5132b4b8919f0d763f589b10a632046152c45371a10d66be682c38c4c1", white-naive = "e39caebbccc7fb9418f693c623a8bc4a969b7cbe8a050fd122119a06f35f80b0" }
filed = "2026-09-04"
notes = "Not a stud bug and not a count bug -- a scale bug. Stroke width is a constant 2.0 output px while fit-to-canvas shrinks the geometry, so the longer the part the less of each feature survives its own outline. Stud rim radius against that stroke, all at the same 256x170 viewBox: 3024 22.5x (clean), 3710 10.3x (clean), 3460 5.8x (clean), 3832 4.3x (bad), 65068 1.9x (bad). Monotone, and the break sits between 5.8 and 4.3. At 65068 a 2px stroke on both sides of a 3.7-unit radius leaves almost no wall, which is why the studs read as solid black bands with scalloped inner edges. Studs are simply the smallest recurring feature, so they drown first -- the ragged black edges reported on other parts are likely the same cause. 3024's single large stud is drawn correctly, base rim as a front arc only, which rules out the 4524 whole-circle defect as the cause here."

