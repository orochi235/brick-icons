# Defects found in corpus renders, filed from the lab.
#
# Written by brick_icons.lab; hand edits are kept but reformatted on the next
# write. `mark` is in fractions of the pane box it was drawn on. `kind` and
# `points` are absent on a plain rectangle, which is every defect filed before
# 2026-09. `seen` is retained for records that carry it; the lab now asks
# labkit whether a mark is stale.
#
# `classes` is the symptom family, from defects.CLASSES: what the drawing
# does wrong, never what causes it. A row nobody can class from its own
# title has none, and there is no `misc`.
#
# `checked` maps a slot to the render sha that was last looked at and judged.
# An open defect whose slot now draws a different sha is looking for review;
# one with no entry for a slot never asks, which is what a record filed
# before this field wants.


[[defect]]
id = "6589-naive-halo-r12.8"
part = "6589"
engines = ["naive"]
status = "fixed"
title = "spurious ring at r=12.80 (separator refit)"
mark = { x = 0.3322, y = 0.4281, w = 0.02, h = 0.0436 }
seen = { angle = "iso", shading = "outline", shade_style = "flat3" }
checked = { white-naive = "e5314c45e330b9cc402ff7b20ebbade9ab80293c854a92368bafb62689b0cc67" }
filed = "2026-09-03"
notes = """
Fixed by 490c87d. The refit read a bore's visible endpoints as pinch points wherever they lay; PINCH_ON_F_TOL now requires them on the opening circle, and both 6589 rings end at least 0.11 away. Before/after from one tree (scripts/tail-before-after.py 6589:white-naive): both rings gone, 11 diff components, 3393 px, nothing else on the part moved. Over the 201 corpus parts that refit, 458 refits survive and 135 drop.

naive draws a ring at r=12.80 LDU; 6589.dat authors circles only at r=9, 10, 12 and 16. The counterbore separator refit in hlr._snap_rim_crossings refits the authored r=16 ring onto this circumcircle (0.800x radius, sweep 121.72 -> 220.79 deg). SEP_REFIT_MAX_GROWTH caps angular growth at 10x, so 1.81x passes; nothing guards the radius. occt draws the authored set and is right.

2026-09-12: three candidate guards measured over 1,500 corpus parts (201 that
refit, 593 refits; `scripts/measure-refit-radius.py`, rows in
out/refit-radius/rows.jsonl). All three fail to separate this defect from a
sound refit:

  radius ratio  legitimate refits shrink as hard as this one -- 0.830-0.856x
                against 6589's 0.800x and 0.944x.
  displacement  `dev`, how far the refit moves the curve it claims to snap
                (the quantity `_refit_candidates` already computes). Looked
                decisive on 138 parts -- everything <=0.242, nothing until
                0.543, 6589's 0.27/0.29 in the gap -- and the gap filled in
                completely at 1,500: 0.242, 0.244, 0.254, 0.274, 0.286,
                0.308, 0.317.
  result sweep  6589 refits to 344.7 and 220.8 deg; parts whose refits are
                CORRECT sit at 271-273. p50 over the corpus is 273.

`scripts/refit-ink-ab.py` draws a part twice in one process, disarming pass 2
by dropping SEP_REFIT_MAX_GROWTH to 0, and component-counts the diff. It is
what judged those parts, and the oracle cannot: the census draws strokeless,
so a spurious ring contributes no silhouette and both passes measure
identically (6589 d99 0.53 either way).

What the A/B sheet shows is that a BAD refit lays an ellipse across the
part's FACE while a sound one adds short arcs sitting ON the rim it snaps to
-- a difference in what the refit attached itself to, not in any scalar about
the resulting curve. That points at candidate selection rather than at the
guards: `emms` takes any arc within 1% of the full circle's radius whose
centre is under rF away, and `bores` any arc under 0.9 rF within 0.35 rF.
Both are inferences from measured geometry, which is the rule shape CLAUDE.md
says is wrong by construction here. A fourth scalar guard is fighting the
wrong thing."""

