2026-09-16: still reproduces at HEAD 161156e, and it is plain at 900 px where a 300 px panel hides it: a line runs the whole way round the disc's side wall at about half its height, splitting the wall into an upper and a lower band. The browser reference draws that wall as one surface. Nothing is missing alongside it -- the edge oracle covers 3435.0 px of declared edge with 0 gaps -- so this is ink nothing declared, not a contour in the wrong place.

Cause found, not fixed. The ring is the tangent seam between 11833s01's two stacked outer-wall cylinders (48\\1-8cyli y0-4 and 48\\1-12cyli y4-8, both r=40); nothing is declared there. It is drawn because authored_loci turns every `edge` primitive into a WHOLE-circle locus, and the eight 48\\1-48edge at y=4, r=40 (7.5 degrees each, the notch steps) then claim the seam all the way round. Bounding edge/crease loci to their declared sectors (merged per carrier) removes the ring but is not usable: 4019's hole rims and 2654a's base ring are drawn only through that whole-circle expansion (their carriers hold two partial edge primitives and nothing else), and they lose real edges. A fix has to tell this seam apart from those rims -- e.g. by what the fragment's two faces are (same cylinder surface) -- rather than by the locus extent.

2026-09-17 review better

