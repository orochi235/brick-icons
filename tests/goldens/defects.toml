[[defect]]
id = "35480-bore-reads-flat"
part = "35480"
engines = ["occt"]
status = "fixed"
title = "looking down a stud the tube has no depth, where LDView shows a lit far wall"
classes = ["shading"]
checked = { occt = "cf648025af5982760b76b0132a02816deae509419e7852a9facdb2ce852b91e9", silhouette-occt = "51f19071ce2808715c584c704edec3146097de03b51488d0cc7b596fd6d64feb", translucent-occt = "65c7a96055d5944b98b724c86510370b6fa55f1ccf60017f7daf4197e83135a3", white-occt = "36c21fa1babca9b72ac90bdd0d86f91377ea3f77fe9a0c43880f68bbf0435d36" }
filed = "2026-09-07"
notes = """
Not a missing fill. The bore is drawn as two correctly-split fills that shade consistently across the seam f832da6 keeps. What flattens it is the max(0.0, n . L) clamp in shade._axis_binned_stops (also shade.ramp, and the b array above it). Looking down a bore you see the half of the tube whose normals sweep a full 180 degrees, so the terminator lands mid-span: face 29's eight raw n.L bins run -0.44 -0.19 +0.03 +0.24 - +0.41 +0.52 +0.53 and the first two floor to the same value. The SVG shows it -- g9's stops at 0%, 6.2% and 18.8% are all #565656, and a quarter of the face's area sits pinned at that floor. An exterior wall does not show it because its visible half is mostly lit and the terminator sits near a limb. LDView gives the shadowed side ambient falloff instead of a floor. THE FIX IS A LIGHTING-MODEL CHANGE AND MOVES EVERY RENDER IN THE CORPUS, so it is Mike's call, like the constant stroke width. Before scoping it, check a Technic pin hole: any deep recess seen down its own axis should show the same thing. Measured by brick-icons-e4.

2026-09-17 review neutral: front wall is better but borehole shading is worse

2026-09-23 review better

2026-09-24: root cause found and fixed at cccfe19. The bore was never missing a gradient -- shade's max(0, n.L) pinned every normal facing away from the light to one floor tone, and looking down a bore you see exactly the half of the tube whose normals sweep 180 degrees. shade.LAMBERT_WRAP now moves the terminator to n.L = -0.3. Awaiting a redraw to judge on /review.

2026-09-24 (later): the cccfe19 diagnosis was wrong -- the bore was never on the shading floor for lack of a wrap. occt's _span_face sampled the cylinder's OUTWARD normal on every span, so a bore's far wall was lit as the outside of a tube: the middle of the visible wall, which faces the camera and the light, read as the terminator. LAMBERT_WRAP was tuned on that misreading. Fixed in the working tree, uncommitted: an away-facing span's samples are negated (occt._span_face); wall ramps are keyed by radius, so a stud's r6 wall and its r4 bore no longer share one zigzag ramp (occt._surface_key); and the refine pass can probe occt walls at last (shade._face_depth_probe read a `prim` key only naive faces carry), so a buried wall no longer paints into a hole. Awaiting a redraw to judge on /review.

2026-09-25 review fixed"""

