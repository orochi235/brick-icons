notes = "A 28.2 x 3.3 px gray taper runs off the right end of the orange eyebrow, tapering into the body tone. It is a sliver of the HOLLOW BORE -- the r=6 cylinder at origin [0,4,0] inside the head, whose near span (depth 10.14) sits behind the head wall (depth 12.81) and should be entirely hidden. It reaches the SVG as its own element filled with that span's wall gradient (#565656 -> #9d9d9d), painted at (99.8,86.6)-(128.0,89.9). occt only: naive draws the brow ending clean, and LDView has nothing there. Print only in the sense that the split head wall is what lets it through -- the unprinted 3626c does not show it. Likely the same family as 3626cp7d-floating-ink-diamond, which is also occt-only and print-only and sits at a similar height."

