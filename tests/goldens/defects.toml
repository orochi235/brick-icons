[[defect]]
id = "u8204-occt-stud-rim-wedges-inked-black"
part = "u8204"
engines = ["occt"]
status = "open"
title = "two black-filled wedges per stud thicken every stud outline"
classes = ["stray-ink"]
filed = "2026-09-23"
notes = """
At the canonical canvas width (256) u8204 emits 62 hairline paths filled #000000 -- two per stud, at the left and right extremes where the stud cylinder limbs meet the top ellipse. They read as heavy stud outlines. The mirror partner u8205 draws 1 under the same config.

Not the part: at canvas width 200 the counts swap -- u8205 grows 59 and u8204 drops to 12; at 297 and 400 both sit at 2-10. So the inking fires in a scale band, not on a geometry the part alone has. Both parts flatten to 474 tris and the same bbox (160 x 8 x 80).

Repro: .venv/bin/python -m brick_icons.cli u8204 --format svg --shading outline --shade-style white --angle iso --engine occt --line-width 2 --silhouette-width 2 --width 256, then count elements carrying stroke-width="0.8" and fill="#000000"."""

