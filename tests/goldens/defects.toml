title = "the inside wall of a round bore draws flat instead of ramped"
classes = ["shading"]
checked = { white-occt = "0dee4b34a09404a1250b0a021688c311464d44a738fcbe42e750846110cb3f12" }
filed = "2026-09-23"
notes = """
Each open stud draws its OUTER cylinder wall with a linear ramp and the bore interior as one flat mid-grey disc. Splitting the SVG by fill type shows it: every gradient element is an outer wall or an ornament band, and the bore interiors are in the flat set. LDView shades the inside of the tube brightly on the far side.

What is NOT the cause, measured:
- Not ink. The 28 #000000 fills in the render are junction wedges scattered over the fence panel (11 from _ink_lens_pockets, 17 from _weld_junction_notches); none of them is inside a bore.
- Not a missing analytic surface. 19121 flattens to 15 Cylinder primitives, r=4 (bore) and r=6 (outer wall) per stud.
- Not a missing gradient at construction. Instrumenting occt._span_face gives 28 wall faces for this part, 14 interior and 14 exterior, EVERY one of them carrying grad_axis -- the bore interior halves among them.
- Not primitives.Cylinder.faces, whose docstring covers the interior far half (4019 white voids): shade.faces_from_analytic is never called on the occt path.

So the ramp is built and lost downstream of _span_face -- ordering, clipping or the group-ramp handoff (occt.py around 2137-2170 and 2280-2330 pop grad_axis in favour of a group ramp). Next step: instrument those pops and the visibility sort for the r=4 spans.

Repro: .venv/bin/python -m brick_icons.cli 19121 --engine occt --shading outline --shade-style flat3 --angle iso --format svg

