status = "open"
title = "centre stud has no top ellipse and the brace between the studs is unfilled"
classes = ["over-cull", "arc-loss"]
filed = "2026-09-07"
notes = "Two symptoms on the top face, against naive at the same pose. The front-centre stud is drawn as an open cup: its top ellipse is absent where the other three studs each carry one. The four-armed brace between the studs comes out as an outline in top-face tone with a stray thin arc floating inside it; naive fills the same shape dark. Total top-face-tone area is not the tell -- occt paints 348,827 px of it against naive's 323,132, so this is features not being built, not fill being lost. Spotted on a wall sheet stamped 4b290bc and blamed on the full-turn merge; it is not that. At 8e436a5, the commit before that merge, the render differs by 36 px in 9 components of 1-4 px each, which is antialias. flat3 disables gradients in fill_ops, so a shading change cannot move this part. Confirmed at --shading outline with no shade-style, where the render carries no fills at all: both features are missing as STROKES. naive draws the center stud's top ellipse and all four brace arms; occt draws neither, so 'unfilled' in the title is too narrow -- nothing is filled wrongly, the ops never reach the stroke list. Measured with scripts/engine-overlay.py at 1000 px wide: 88.8% shared ink, naive-only 4,445 px in 14 components, of which two are chunky -- 4,051 px over the brace and the center stud rim, and 372 px continuing it on the rim's lower right -- and the other twelve are 1-4 px antialias crumbs."

