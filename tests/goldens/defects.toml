filed = "2026-09-12"
notes = """
2026-09-16: nothing is mirrored at HEAD 161156e, and the occt slot draws this sticker in the browser reference's own pose. The DECAL slot is what is wrong, and it is wrong in the canvas rather than the ink: 6288456b is authored 1.8 wide by 2.8 tall, the artwork runs along the long axis, and the flat decal comes out on a landscape canvas with the text turned across it -- the canvas aspect is transposed. Identical at 44aeaf1. This row should be read against `decal`, not `occt`. Evidence: out/sheets/mirrored-decal-ab.png (decal) and out/sheets/mirrored-occt.png (occt).

2026-09-23: measured, not fixed. The flat decal is the whole picture turned 90 degrees, not ink misplaced on a right-shaped canvas: 6288456b is authored "Sticker 1.8 x 2.8" and its canvas comes out 900x579, aspect 1.554 against the part's 1.556, so the long authored axis became the canvas WIDTH and the lettering reads bottom to top. 22385d01 ('Tile 3 x 2') comes out 530x900 the same way. Both carriers are flat and level, so unwrap.up_aligned takes its documented fallback -- a face whose normal is LDraw up has no up to inherit, and +Z is used as the top of a glyph, measured once on 2431pt2 and 3068bpfi. These two parts want +X. Fixing it means choosing the frame per part rather than by a fixed axis, and the engine has no oracle for which way up a sticker reads: the browser reference draws the part, not the sheet. Someone has to settle the convention before this is code.

2026-09-23 review better"""

