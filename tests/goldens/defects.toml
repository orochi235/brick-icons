notes = "A panel on the right of the head reads as a distinctly darker rectangle against the wall around it; LDView shades that area continuously. The wall closes a full turn and takes a RADIAL gradient (g0, 10 stops #cecece -> #7e7e7e, the dome ramp). One sector did not join that merge and kept a LINEAR axis gradient (g16, x1 193.75,84.64 -> x2 153.16,115.02) whose 10 stops run #565656 -> #5a5a5a: nearly flat, and its whole range sits BELOW the radial's darkest stop, which is why it reads as a panel rather than as a seam. Two gradient models on one surface. The head body is two coaxial cylinder primitives with identical axis [0,1,0], r=13.000, h=13.000 and origin [0,4,0] -- sectors of one surface -- so the merge has everything it needs to identify them; find why one span is left out. Disproved, so do not re-derive: absorb_wall_facets is NOT involved (this part has zero flat color-16 triangle faces; every body triangle already carries a gradient), and the three flat #cccccc paths in the SVG are the stud's discs and rings at the top, not the panel -- confirmed by repainting those paths magenta. Also not the decal work: unrelated to 3626cp7d-glasses-lose-their-color, which is fixed, and the panel survives that fix. CORRECTION, 2026-09-08: the absorb_wall_facets disproof above is wrong and 2f54f58 fixed it there. The test that matters runs per FACE and the other way round -- a radially shaded FACET sitting on the barrel's surface, not a flat facet group abutting a band -- which is why the group-wide intersection could not see it."

