notes = "Caused by f832da6. _pierce_seams keeps 3 seams on this head and the split puts new ink under the stud base -- the same defect class the fix removes on 35480, appearing somewhere it was not. 127 px in 1 component, read against LDView at a matched crop. Two narrowings are already disproven: requiring the seam's two faces to straddle the plane changes nothing (all 3 already do, as do 67811's 17 and 35480's 2), and requiring the seam to lie inside a real planar FACE rather than its infinite plane kills 35480's own seams, because the plate top is many small triangles and none of them contains the circle. Reproduce by disarming in process: occt._pierce_seams = lambda s: [] and render both ways. See 67811-notch-through-hub-wall."

