title = "a black diamond floats in the middle of the head with nothing under it"
classes = ["stray-ink"]
filed = "2026-09-08"
notes = "A black lozenge sits mid-head to the right of the glasses arm with no feature under it -- LDView has nothing there and naive draws nothing there. It is a CLOSED 5-point subpath in the interior stroke layer, `M 159.65 84.93 L 158.85 84.66 L 159.76 84.36 L 160.70 84.66 Z`: 1.85 x 0.57 SVG units, so the 2px stroke fills it solid and it reads as a blob rather than as a loop. Do not look for a fill: removing every <path/> in the fill layer leaves it, and it disappears with the one big interior-stroke path. occt only and print only -- absent from the naive render of the same part and from the unprinted 3626c. Scan for it with the tiny-subpath sweep: split the stroke path's d on `M `, and flag any subpath whose bbox is under ~6 units."

