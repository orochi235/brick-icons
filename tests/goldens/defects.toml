2026-09-23: diagnosed, not fixed. The wedge is a lighter fill painted OVER the rib front, with a straight diagonal boundary, which is what two interpenetrating faces look like under a painter's algorithm -- the same single-witness decision 2310-crap-on-darkest-face-and comes back to. order_faces settles each overlapping pair at ONE most-interior witness point, so a pair whose depth order REVERSES across the overlap gets one answer for a region that needs two. Measured at iso on the 480 ordered faces: sampling each pair inside its own rasterized overlap (not its bbox), 102 pairs of 9,856 have samples of both signs, so the reversal is common rather than exotic. Caveat on that number: it reads every face through its plane depth function, where order_faces reads an analytic face through its own occluder, so curved faces are over-counted and the planar pairs are the solid part of it. No single witness can order an interpenetrating pair; the classic answer is to split one face along the pair's screen-space intersection line and order the pieces, which is a real piece of work and a decision to take deliberately.

2026-09-23 review neutral"""

