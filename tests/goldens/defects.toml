[[defect]]
id = "35485-ring-is-broken"
part = "35485"
engines = ["occt"]
status = "fixed"
title = "ring is broken"
classes = ["arc-loss"]
checked = { occt = "132363e2d1d9e383a60926528b1966a1050bc5ddfd93b46e464abfff81af7a3a", silhouette-occt = "420895f369ab90607ee7685d741f4b86ad1c3253923b818e225dd1cfe98de2de", translucent-occt = "ed187f5f1a06858bf51455d115f87000e41dc0e0567b17530cd8844750494656", white-occt = "cd3f92050b7cb7c1549aef60674e92f730b4171448858fb47558b4f26e3c9980" }
filed = "2026-09-07"
notes = """
Fixed by 5a2d856 (oblique cones ruled through ThruSections). A/B at HEAD 718d9e4, occt iso outline/flat3 512 wide, with occt.oblique_cone disarmed in-process: the ring's outer wall comes back broken into misplaced bands, 50,429 px in 48 components of 12 px or more, largest 29,177. At HEAD the ring closes. A small step remains in the outer band at the far right, which LDView does not show.

The ring is 8 cones whose axis leans 1.2 degrees out of the cross-section
plane, and occt.frame rejects every one, so the shape has holes where they
should be. bd537b1 fixed the cylinder form of this.

THE LIMB MATH IS NOT THE BLOCKER -- an earlier note here said it was and that
is wrong. For a ruled surface between two parallel circles (centres offset by
D, radii r0 and r1, section axes X and Y) the normal is
  n(u, v) = rho(v) * [cos u (Y x D) - sin u (X x D) - (r1 - r0)(X x Y)]
so its DIRECTION does not depend on v at all, and it is exactly the
cos/sin/constant form _limb_params solves: a = Y x D, b = -(X x D),
c = -(r1 - r0)(X x Y). Checked numerically against a finite-difference normal
to 1e-10. The cylinder case is this with r0 = r1, which is why the extrusion
path already works.

What blocks it is REPRESENTATION: OCCT has no analytic type for an oblique
cone (gp_Cone is right circular), so a face built through ThruSections comes
back a BSpline, and _curved_frame reads the surface rather than a record of
what built it -- it would occlude correctly, contribute no fill, and trip
test_every_corpus_surface_kind_is_one_the_face_producer_handles. So the choice
is: recognise a degree-1-in-v BSpline whose two boundary curves are parallel
circles, or carry the primitive's own description alongside the face.

Corpus-wide this is 1,493 oblique cones across 344 parts, superseding the 101
an earlier version of this note gave. That figure came from the 150
highest-skew parts, which is the wrong cohort: skew-deg is a per-part MAX and
the axis column is unread for rings, discs and edges, so the top of that
ranking is junk axis columns frame() already absorbs through PLANAR_KINDS,
only 63 of those 150 hold a cone at all, and 35485 itself ranks 5,923rd at
1.203 deg. A further 354 cones drop for an elliptical cross-section, which
this fix does not address; nothing drops for any other reason. Re-derive with
scripts/measure-cone-drops.py."""

