filed = "2026-09-08"
notes = "Fixed by 22453b4. The premise this entry was filed on was wrong twice. The two limb-split pieces do NOT disagree at the limb -- they share the #565656 end stop -- and the 157.5 deg piece is hidden behind the facets entirely. The band is the 67.5 deg piece alone, painted against a facet dome that attach_group_gradients had ramped RADIALLY, so the mechanism is the naive one after all. 3626cp7d authors the head as a facet dome over 135 deg and as an exact barrel over the other 225; the unprinted 3626c is a full 360 deg barrel with no facets on it and no band, so the split comes in with the print. occt needs no substituted `prim` to match it: the sewn shape's own planar faces ARE the dome, and _face_occluder already builds the wall's exact surface. _absorb_dome_walls runs shade.facet_on_wall (lifted out of absorb_wall_facets' closure; oriented=False because a sewn plane's orientation is not a statement about facing) per FACE -- 8 of the 955 radially shaded planes lie on each r=13 barrel span and 0 lie on the stud, neck or collar cylinders. Every part in the golden manifest absorbs 0 walls and BRICK_GOLDENS=full was green with nothing re-frozen. The pass must skip a span that already carries grad_radial: attach_group_gradients adds a grad_axis to a full-turn group that _merge_turn_gradients drops again, and without the guard 4740's five turn spans get pulled into a plane group. The entry's second finding is answered and is NOT a bug -- a cylinder's normal carries no axial term, so _limb_params returns two roots unless the axis points at the camera; full_turn is false for a side-on cylinder by construction and its near and far halves really are two sides. At lat=90 all of 4740's cylinder spans do come out full turns and take the radial ramp."

